name: Mobile parity

# Flags PRs that touch a surface the Aegyo mobile app consumes
# (docs/MOBILE_CONTRACT.md): adds the `mobile-parity` label and keeps one
# sticky checklist comment up to date. Informational; it never fails.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/games/registry.ts"
      - "src/games/*/meta.ts"
      - "src/shell/host.tsx"
      - "src/app/play/**"
      - "src/app/api/session/**"
      - "src/app/api/leaderboards/**"
      - "src/app/api/competition/**"
      - "src/app/api/accounts/**"
      - "src/accounts/cookies.ts"
      - "src/app/api/_shared/http.ts"
      - "src/i18n/**"
      - "src/app/championship/**"
      - "src/app/account/**"
      - "public/games/**"
      - "docs/MOBILE_CONTRACT.md"

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: mobile-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER = "<!-- mobile-parity:sticky -->";
            const LABEL = "mobile-parity";
            // Keep in sync with `on.pull_request.paths` above.
            const GUARDED = [
              "src/games/registry.ts",
              "src/games/*/meta.ts",
              "src/shell/host.tsx",
              "src/app/play/**",
              "src/app/api/session/**",
              "src/app/api/leaderboards/**",
              "src/app/api/competition/**",
              "src/app/api/accounts/**",
              "src/accounts/cookies.ts",
              "src/app/api/_shared/http.ts",
              "src/i18n/**",
              "src/app/championship/**",
              "src/app/account/**",
              "public/games/**",
              "docs/MOBILE_CONTRACT.md",
            ];
            const toRegex = (glob) =>
              new RegExp(
                "^" +
                  glob
                    .replace(/[.+^${}()|[\]\\]/g, "\\$&")
                    .replace(/\*\*/g, "\u0000")
                    .replace(/\*/g, "[^/]*")
                    .replace(/\u0000/g, ".*") +
                  "$",
              );
            const patterns = GUARDED.map(toRegex);

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100,
            });
            const matched = [
              ...new Set(
                files
                  .flatMap((file) => [file.filename, file.previous_filename])
                  .filter((name) => name && patterns.some((re) => re.test(name))),
              ),
            ].sort();
            if (matched.length === 0) {
              core.info("No mobile-consumed files changed.");
              return;
            }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: LABEL,
                color: "fbca04",
                description: "Touches a surface the Aegyo mobile app consumes",
              });
            }
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [LABEL],
            });

            const contract = `https://github.com/${owner}/${repo}/blob/${context.payload.pull_request.head.sha}/docs/MOBILE_CONTRACT.md`;
            const body = [
              MARKER,
              "### Mobile parity",
              "",
              `This PR touches files the Aegyo mobile app depends on. Read the [mobile contract](${contract}) and complete the **Mobile parity** section of the PR description.`,
              "",
              "<details open><summary>Matched files</summary>",
              "",
              ...matched.map((name) => `- \`${name}\``),
              "",
              "</details>",
              "",
              "- [ ] No mobile-consumed surface changed",
              "- [ ] Contract updated in docs/MOBILE_CONTRACT.md",
              "- [ ] Mirror issue opened in aegyo-mobile: #___",
              "",
              "New game: add the mobile catalog entry and both posters to the mirror issue. New user-facing feature: state ship, skip or follow-up for mobile.",
              "",
              "Open the mirror issue with `gh issue create --repo Myosin-xyz/aegyo-mobile --label web-parity --title \"web-parity: <change>\"`.",
            ].join("\n");

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" && comment.body?.includes(MARKER),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
