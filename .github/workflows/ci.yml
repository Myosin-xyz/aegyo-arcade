name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arcade
          POSTGRES_PASSWORD: arcade
          POSTGRES_DB: aegyo_arcade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arcade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://arcade:arcade@localhost:5432/aegyo_arcade_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: migrate test database
        run: DATABASE_URL="$TEST_DATABASE_URL" pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - name: bundle-budget (static approximation)
        run: node scripts/check-bundle-budget.mjs
      - name: claw asset budgets (non-destructive)
        run: node scripts/check-claw-assets.mjs
      - name: e2e (production build)
        env:
          DATABASE_URL: postgres://arcade:arcade@localhost:5432/aegyo_arcade_test
        run: |
          node scripts/ops/activate-demo-claw.mjs --reason "ci e2e demo mode" --yes
          pnpm exec playwright install chromium --with-deps
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
